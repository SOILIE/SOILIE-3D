AWSTemplateFormatVersion: '2010-09-09'
Description: Private, recoverable research checkpoints; never served by CloudFront.
Resources:
  ResearchArchive:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub soilie3d-research-private-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: SOILIE-3D
        - Key: Purpose
          Value: private-research-recovery
  ArchivePolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ResearchArchive
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireTLS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ResearchArchive.Arn
              - !Sub '${ResearchArchive.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
Outputs:
  Bucket:
    Value: !Ref ResearchArchive
